<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbuns - Gorillaz</title>
  <link rel="stylesheet" href="css/albuns.css">
  <script src="js/albuns.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="tag">Discografia</p>
      <h1>Álbuns de estúdio</h1>
      <p>Assista aos clipes diretamente nesta página.</p>
      <a class="voltar" href="spider.html">&larr; Voltar para a biografia</a>
    </header>

    <form id="filtros" role="search">
      <div>
        <label for="busca">Procurar álbum</label>
        <input id="busca" type="search" placeholder="Ex.: Demon Days" autocomplete="off">
      </div>
      <div>
        <label for="ordem">Organizar por</label>
        <select id="ordem">
          <option value="antigos">Mais antigos</option>
          <option value="recentes">Mais recentes</option>
          <option value="az">Nome (A–Z)</option>
        </select>
      </div>
      <button type="reset">Limpar</button>
    </form>

    <p id="resultado" aria-live="polite"></p>

    <section id="grade" aria-label="Lista de álbuns">
      <article class="album" data-ano="2001" data-nome="Gorillaz">
        <span>2001</span><h2>Gorillaz</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/videoseries?list=PLHwvDXmNUa93W-eDTDFWjpVJFfV8ZKUXu&amp;iv_load_policy=3" title="Player de vídeos - Gorillaz" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
      <article class="album" data-ano="2005" data-nome="Demon Days">
        <span>2005</span><h2>Demon Days</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/videoseries?list=PLxzSZG7g8c8xSdLdrwSQAdxGeA9WZQ6EW&amp;iv_load_policy=3" title="Player de vídeos - Demon Days" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
      <article class="album" data-ano="2010" data-nome="Plastic Beach">
        <span>2010</span><h2>Plastic Beach</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/o7foNO37u9s" title="Player de vídeos - Plastic Beach" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
      <article class="album" data-ano="2010" data-nome="The Fall">
        <span>2010</span><h2>The Fall</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/ttIPi-mdpLc" title="Player de vídeos - The Fall" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
      <article class="album" data-ano="2017" data-nome="Humanz">
        <span>2017</span><h2>Humanz</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/videoseries?list=PLWlFM6y30qW_Kmy96eyYc0vFZZsS59YIF&amp;iv_load_policy=3" title="Player de vídeos - Humanz" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
      <article class="album" data-ano="2018" data-nome="The Now Now">
        <span>2018</span><h2>The Now Now</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/videoseries?list=PLYZmrxnxYUMNXt-DXorPbKXHxB9Mm7ZGH&amp;iv_load_policy=3" title="Player de vídeos - The Now Now" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
      <article class="album" data-ano="2020" data-nome="Song Machine, Season One: Strange Timez">
        <span>2020</span><h2>Song Machine, Season One: Strange Timez</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/videoseries?list=PLxA687tYuMWja9nqeXUzc2KmdglKjKKdn&amp;iv_load_policy=3" title="Player de vídeos - Song Machine, Season One: Strange Timez" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
      <article class="album" data-ano="2023" data-nome="Cracker Island">
        <span>2023</span><h2>Cracker Island</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/uOMl_nRhQOw" title="Player de vídeos - Cracker Island" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
      <article class="album" data-ano="2026" data-nome="The Mountain">
        <span>2026</span><h2>The Mountain</h2>
        <div class="album-video"><iframe src="https://www.youtube.com/embed/videoseries?list=PL4iSbgi3WlCpNBGAf5bGCgNQpovdIIyhk&amp;iv_load_policy=3" title="Player de vídeos - The Mountain" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      </article>
    </section>
  </main>
</body>
</html>
